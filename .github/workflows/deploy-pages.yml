name: Deploy Demo Site

on:
  push:
    branches:
      - delta-03
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo-site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: demo-site
        run: pnpm install --frozen-lockfile

      - name: Build static demo
        working-directory: demo-site
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Disable Jekyll
        run: touch demo-site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site/out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
